<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>CEO Module | Shekinah Pharmacy</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--primary:#173b8f;--secondary:#2563eb;--text:#172033;--muted:#64748b;--light:#f5f8ff;--white:#fff;--border:#e5eaf2;--danger:#b91c1c;--success:#15803d}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--light);color:var(--text)}
.top{min-height:72px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:5}.brand{font-weight:800;color:var(--primary)}.actions{display:flex;gap:10px}.btn{border:1px solid var(--border);background:#fff;border-radius:9px;padding:10px 14px;cursor:pointer}.btn.primary{background:var(--primary);color:#fff;border-color:var(--primary)}
main{max-width:1200px;margin:0 auto;padding:32px 20px}.card{background:#fff;border:1px solid var(--border);border-radius:16px;padding:24px}.muted{color:var(--muted)}.error,.success{display:none;padding:12px;border-radius:10px;margin-bottom:16px}.error{background:#fff1f2;color:var(--danger)}.success{background:#f0fdf4;color:var(--success)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:22px 0}.toolbar input,.toolbar select,.form-grid input,.form-grid select{border:1px solid var(--border);border-radius:9px;padding:11px 12px;background:#fff;font:inherit}.toolbar input{flex:1;min-width:220px}
.module-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:22px}.tile{border:1px solid var(--border);border-radius:12px;padding:18px;background:#fff;cursor:pointer;text-align:left;font:inherit;width:100%}.tile:hover{border-color:var(--secondary);box-shadow:0 5px 18px rgba(23,59,143,.08)}.tile strong{display:block;margin-bottom:7px}.hidden{display:none!important}
.table-wrap{overflow:auto;border:1px solid var(--border);border-radius:12px}.data-table{width:100%;border-collapse:collapse;min-width:850px}.data-table th,.data-table td{padding:12px 14px;border-bottom:1px solid var(--border);text-align:left;font-size:14px}.data-table th{background:#f8fafc;color:#475569}.data-table tr:last-child td{border-bottom:0}.status{display:inline-block;padding:4px 9px;border-radius:999px;font-size:12px;font-weight:700}.status.active{background:#dcfce7;color:#166534}.status.inactive{background:#fee2e2;color:#991b1b}.actions-cell{display:flex;gap:7px;flex-wrap:wrap}.small-btn{border:1px solid var(--border);background:#fff;border-radius:7px;padding:7px 9px;cursor:pointer}.small-btn.danger{color:var(--danger)}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.48);display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.modal.show{display:flex}.modal-box{background:#fff;border-radius:16px;width:min(680px,100%);max-height:92vh;overflow:auto;padding:24px}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.close{border:0;background:transparent;font-size:28px;cursor:pointer}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.form-group{display:flex;flex-direction:column;gap:6px}.form-group label{font-size:13px;font-weight:700;color:#475569}.form-group.full{grid-column:1/-1}.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}.empty{padding:28px;text-align:center;color:var(--muted)}
@media(max-width:700px){.module-grid{grid-template-columns:1fr}.top{padding:0 14px}.top .brand{font-size:14px}main{padding:22px 14px}.card{padding:18px}.form-grid{grid-template-columns:1fr}.form-group.full{grid-column:auto}.actions .btn{padding:8px 10px}}
</style>
</head>
<body>
<header class="top"><div class="brand">Shekinah Pharmacy · CEO Portal</div><div class="actions"><button class="btn" onclick="location.href='ceo-dashboard.html'">← Dashboard</button><button class="btn" onclick="logout()">Sign Out</button></div></header>
<main>
<div id="error" class="error"></div><div id="success" class="success"></div>
<section class="card">
<h1 id="title">Loading module...</h1><p id="desc" class="muted">Checking your CEO session.</p>
<div id="moduleHome"></div>
<div id="staffPanel" class="hidden">
<div class="toolbar"><input id="staffSearch" type="search" placeholder="Search name, email or staff ID"><button class="btn primary" onclick="openStaffModal()">+ Add Staff</button><button class="btn" onclick="loadStaff()">Refresh</button></div>
<div class="table-wrap"><table class="data-table"><thead><tr><th>Staff</th><th>Staff ID</th><th>Role</th><th>Branch</th><th>Status</th><th>Salary</th><th>Actions</th></tr></thead><tbody id="staffRows"><tr><td colspan="7" class="empty">Loading staff...</td></tr></tbody></table></div>
</div>
</section></main>
<div id="staffModal" class="modal"><div class="modal-box"><div class="modal-head"><h2 id="modalTitle">Add Staff</h2><button class="close" onclick="closeStaffModal()">×</button></div>
<form id="staffForm"><input type="hidden" id="editId"><div class="form-grid">
<div class="form-group"><label>Staff ID</label><input id="staffId" required placeholder="e.g. SP-001"></div>
<div class="form-group"><label>Full Name</label><input id="fullName" required placeholder="Full name"></div>
<div class="form-group"><label>Email</label><input id="email" type="email" required placeholder="staff@example.com"></div>
<div class="form-group"><label>Phone</label><input id="phone" placeholder="Phone number"></div>
<div class="form-group"><label>Role</label><select id="roleId" required></select></div>
<div class="form-group"><label>Branch</label><select id="branchId"></select></div>
<div class="form-group"><label>Department</label><input id="department" placeholder="Pharmacy / Admin / Finance"></div>
<div class="form-group"><label>Job Title</label><input id="jobTitle" placeholder="Job title"></div>
<div class="form-group"><label>Salary</label><input id="salary" type="number" min="0" step="0.01" placeholder="0"></div>
<div class="form-group"><label>Account Status</label><select id="accountStatus"><option value="active">Active</option><option value="inactive">Inactive</option></select></div>
<div class="form-group"><label>Employment Status</label><select id="employmentStatus"><option value="active">Active</option><option value="inactive">Inactive</option><option value="terminated">Terminated</option><option value="on_leave">On Leave</option></select></div>
<div class="form-group"><label>Date Joined</label><input id="dateJoined" type="date"></div>
<div class="form-group full"><label>Address</label><input id="address" placeholder="Address"></div>
</div><div class="modal-actions"><button type="button" class="btn" onclick="closeStaffModal()">Cancel</button><button type="submit" class="btn primary" id="saveStaffBtn">Save Staff</button></div></form></div></div>
<script>
const SUPABASE_URL="https://manyvsuibdemvclgxoyl.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_ZMeTYOLRhxGJpgKxmuCvMw_OVNxGe3X";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
let currentUser=null, staffCache=[], rolesCache=[], branchesCache=[];
const modules={
 staff:{title:'Staff & Admin Management',desc:'Manage staff profiles, roles, account status and branch assignments.'},
 branches:{title:'Branch Management',desc:'Manage Shekinah Pharmacy branches and branch assignments.'},
 inventory:{title:'Pharmacy Inventory',desc:'Manage medicines, stock, batches, suppliers and expiry tracking.'},
 sales:{title:'Sales / POS',desc:'Sales and point-of-sale operations will be connected to the central database.'},
 customers:{title:'Customers & Debt',desc:'Customer accounts, balances and debt tracking across branches.'},
 finance:{title:'Accounting & Finance',desc:'Revenue, expenses, purchases and financial reconciliation.'},
 reports:{title:'Reports & Analytics',desc:'Business performance and cross-branch reporting.'},
 ai:{title:'Shekinah AI',desc:'AI-assisted business questions and alerts, restricted to authorized CEO data.'}
};
function showError(m){const e=document.getElementById('error');e.textContent=m;e.style.display='block';document.getElementById('success').style.display='none'}
function showSuccess(m){const e=document.getElementById('success');e.textContent=m;e.style.display='block';document.getElementById('error').style.display='none';setTimeout(()=>e.style.display='none',3500)}
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[c]))}
async function init(){try{const {data,error}=await supabaseClient.auth.getSession();if(error)throw error;if(!data.session?.user){location.href='index.html';return}currentUser=data.session.user;const {data:s,error:se}=await supabaseClient.from('staff').select('id,staff_id,full_name,email,phone,role_id,branch_id,department,job_title,account_status,employment_status,date_joined,salary,address,roles(role_name)').eq('auth_user_id',currentUser.id).maybeSingle();if(se)throw se;if(!s||s.account_status!=='active'||s.roles?.role_name!=='ceo'){await supabaseClient.auth.signOut();location.href='index.html';return}const key=new URLSearchParams(location.search).get('module')||'staff';const m=modules[key]||modules.staff;document.getElementById('title').textContent=m.title;document.getElementById('desc').textContent=m.desc+' Welcome, '+(s.full_name||'CEO')+'.';if(key==='staff'){document.getElementById('moduleHome').classList.add('hidden');document.getElementById('staffPanel').classList.remove('hidden');await loadStaffData()}else{document.getElementById('moduleHome').innerHTML='<div class="module-grid">'+moduleTiles(key).map(x=>`<button class="tile" onclick="moduleAction('${esc(key)}','${esc(x.key)}')"><strong>${esc(x.name)}</strong><span class="muted">Open this section</span></button>`).join('')+'</div>'}}catch(e){console.error(e);showError(e.message||'Unable to load module.')}}
function moduleTiles(key){const map={branches:[['add','Add branch'],['view','View branches'],['performance','Branch performance']],inventory:[['add','Add medicine'],['receiving','Stock receiving'],['alerts','Expiry & low-stock alerts']],sales:[['new','New sale'],['history','Sales history'],['receipts','Receipts']],customers:[['accounts','Customer accounts'],['debt','Outstanding debt'],['payments','Payment history']],finance:[['revenue','Revenue'],['expenses','Expenses'],['reports','Financial reports']],reports:[['branch','Branch report'],['sales','Sales report'],['inventory','Inventory report']],ai:[['ask','Ask Shekinah AI'],['insights','Business insights'],['alerts','Alerts']]} ;return (map[key]||[['open','Open module']]).map(x=>({key:x[0],name:x[1]}))}
function moduleAction(key,action){if(key==='branches'){location.href='ceo-branches.html?section='+encodeURIComponent(action);return}alert('The '+modules[key].title+' section is next in the build. The button is now active and ready for its database module.')}
async function loadStaffData(){await Promise.all([loadRoles(),loadBranches()]);await loadStaff()}
async function loadRoles(){const {data,error}=await supabaseClient.from('roles').select('id,role_name').order('role_name');if(error)throw error;rolesCache=data||[];document.getElementById('roleId').innerHTML=rolesCache.map(r=>`<option value="${r.id}">${esc(r.role_name)}</option>`).join('')}
async function loadBranches(){const {data,error}=await supabaseClient.from('branches').select('id,branch_name,branch_code').order('branch_name');if(error)throw error;branchesCache=data||[];document.getElementById('branchId').innerHTML='<option value="">Central / Unassigned</option>'+branchesCache.map(b=>`<option value="${b.id}">${esc(b.branch_name)}${b.branch_code?' ('+esc(b.branch_code)+')':''}</option>`).join('')}
async function loadStaff(){const q=(document.getElementById('staffSearch').value||'').trim().toLowerCase();let query=supabaseClient.from('staff').select('id,staff_id,full_name,email,phone,role_id,branch_id,department,job_title,account_status,employment_status,date_joined,salary,address,roles(role_name),branches(branch_name)').order('created_at',{ascending:false});const {data,error}=await query;if(error){showError(error.message);return}staffCache=data||[];renderStaff(q)}
function renderStaff(q=''){const rows=staffCache.filter(s=>!q||[s.full_name,s.email,s.staff_id,s.roles?.role_name,s.branches?.branch_name].join(' ').toLowerCase().includes(q));const body=document.getElementById('staffRows');if(!rows.length){body.innerHTML='<tr><td colspan="7" class="empty">No staff records found.</td></tr>';return}body.innerHTML=rows.map(s=>`<tr><td><strong>${esc(s.full_name)}</strong><br><span class="muted">${esc(s.email)}</span></td><td>${esc(s.staff_id)}</td><td>${esc(s.roles?.role_name||'—')}</td><td>${esc(s.branches?.branch_name||'Central / Unassigned')}</td><td><span class="status ${s.account_status==='active'?'active':'inactive'}">${esc(s.account_status)}</span></td><td>₦${Number(s.salary||0).toLocaleString('en-NG')}</td><td><div class="actions-cell"><button class="small-btn" onclick="editStaff('${s.id}')">Edit</button><button class="small-btn ${s.account_status==='active'?'danger':''}" onclick="toggleStaff('${s.id}','${s.account_status}')">${s.account_status==='active'?'Deactivate':'Activate'}</button></div></td></tr>`).join('')}
document.getElementById('staffSearch').addEventListener('input',e=>renderStaff(e.target.value.trim().toLowerCase()));
function openStaffModal(s=null){document.getElementById('modalTitle').textContent=s?'Edit Staff':'Add Staff';document.getElementById('editId').value=s?.id||'';document.getElementById('staffId').value=s?.staff_id||'';document.getElementById('fullName').value=s?.full_name||'';document.getElementById('email').value=s?.email||'';document.getElementById('phone').value=s?.phone||'';document.getElementById('roleId').value=s?.role_id||rolesCache.find(r=>r.role_name==='staff')?.id||rolesCache[0]?.id||'';document.getElementById('branchId').value=s?.branch_id||'';document.getElementById('department').value=s?.department||'';document.getElementById('jobTitle').value=s?.job_title||'';document.getElementById('salary').value=s?.salary??'';document.getElementById('accountStatus').value=s?.account_status||'active';document.getElementById('employmentStatus').value=s?.employment_status||'active';document.getElementById('dateJoined').value=s?.date_joined||'';document.getElementById('address').value=s?.address||'';document.getElementById('staffModal').classList.add('show')}
function closeStaffModal(){document.getElementById('staffModal').classList.remove('show')}
function editStaff(id){const s=staffCache.find(x=>x.id===id);if(s)openStaffModal(s)}
document.getElementById('staffForm').addEventListener('submit',async e=>{e.preventDefault();const id=document.getElementById('editId').value;const payload={staff_id:document.getElementById('staffId').value.trim(),full_name:document.getElementById('fullName').value.trim(),email:document.getElementById('email').value.trim(),phone:document.getElementById('phone').value.trim()||null,role_id:document.getElementById('roleId').value,branch_id:document.getElementById('branchId').value||null,department:document.getElementById('department').value.trim()||null,job_title:document.getElementById('jobTitle').value.trim()||null,salary:Number(document.getElementById('salary').value||0),account_status:document.getElementById('accountStatus').value,employment_status:document.getElementById('employmentStatus').value,date_joined:document.getElementById('dateJoined').value||null,address:document.getElementById('address').value.trim()||null,updated_at:new Date().toISOString()};const btn=document.getElementById('saveStaffBtn');btn.disabled=true;try{let error;if(id){({error}=await supabaseClient.from('staff').update(payload).eq('id',id))}else{({error}=await supabaseClient.from('staff').insert(payload))}if(error)throw error;closeStaffModal();showSuccess(id?'Staff record updated successfully.':'Staff record created successfully.');await loadStaff()}catch(err){showError(err.message||'Unable to save staff record.')}finally{btn.disabled=false}});
async function toggleStaff(id,status){if(!confirm((status==='active'?'Deactivate':'Activate')+' this staff account?'))return;const next=status==='active'?'inactive':'active';const {error}=await supabaseClient.from('staff').update({account_status:next,updated_at:new Date().toISOString()}).eq('id',id);if(error){showError(error.message);return}showSuccess('Staff account '+next+'.');await loadStaff()}
async function logout(){const {error}=await supabaseClient.auth.signOut();if(error){alert(error.message);return}location.href='index.html'}
supabaseClient.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT'||!session)location.href='index.html'});init();
</script>
</body></html>
